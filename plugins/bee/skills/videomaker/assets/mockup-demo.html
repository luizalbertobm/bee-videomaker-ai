<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Demo — mockups de dispositivos</title>
<style>body{margin:0;background:#111;display:grid;place-items:center;height:100vh}canvas{max-height:100vh;max-width:100vw}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="devices.js"></script>
<script>
// Demo de assets/devices.js: portátil e telemóvel em perspetiva, com uma página a fazer scroll no ecrã.
// Copiar para scenes/ junto com devices.js e trocar PAGES pelas capturas de scripts/capture_site.py.
const WIDTH = 1080, HEIGHT = 1920, FPS = 30, DURATION_S = 7;
const FONT = 'system-ui, "DejaVu Sans", Arial, sans-serif';
// Capturas reais: { desktop: '../sources/site-desktop.png', mobile: '../sources/site-mobile.png' }. Vazio = página de exemplo.
const PAGES = {};
const ACCENT = '#5b5bd6';
const canvas = document.getElementById('c'); canvas.width = WIDTH; canvas.height = HEIGHT;
const ctx = canvas.getContext('2d');
const { POSES, mix, float, maxScroll } = Devices;
const clamp01 = x => Math.min(1, Math.max(0, x)), seg = (t, t0, d) => clamp01((t - t0) / d);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, easeIn = t => t * t * t, expoOut = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const SWT = 3.5;   // troca do portátil para o telemóvel

function background() {
  const g = ctx.createLinearGradient(0, 0, 0, HEIGHT); g.addColorStop(0, '#0d0f16'); g.addColorStop(1, '#1b1e2e'); ctx.fillStyle = g; ctx.fillRect(0, 0, WIDTH, HEIGHT);
}
function title(a, b, t, t0) {
  const e = expoOut(seg(t, t0, 0.6)) * (1 - easeIn(seg(t, t0 + SWT - 0.35, 0.3))); if (e <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp01(e * 1.5); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffffff'; ctx.font = `700 104px ${FONT}`; ctx.fillText(a, 72, 380 + (1 - e) * 60);
  ctx.fillStyle = ACCENT; ctx.fillText(b, 72, 500 + (1 - e) * 60); ctx.restore();
}
function render(t, page) {
  background();
  title('A sua loja', 'no portátil.', t, 0.1); title('E também', 'no telemóvel.', t, SWT);
  if (t < SWT + 0.3) {   // portátil: entra de lado, vem para o centro e a página desce; sai por baixo
    const P = float(mix(POSES.laptop.side, POSES.laptop.hero, easeInOut(seg(t, 0.9, 1.1))), t);
    P.cy += (1 - expoOut(seg(t, 0, 1.2))) * 1100 + easeIn(seg(t, SWT - 0.35, 0.6)) * 1300;
    Devices.laptop(ctx, page.desktop, P, { url: 'sualoja.com.br/produtos', theme: 'silver', chrome: 'light',
      scroll: maxScroll('laptop', page.desktop) * 0.55 * easeInOut(seg(t, 1.3, 1.9)) });
  }
  if (t > SWT - 0.2) {   // telemóvel: sobe rodado, endireita-se de frente e a página desce
    const u = t - SWT, P = float(mix(POSES.phone.side, POSES.phone.front, easeInOut(seg(u, 1.0, 1.2))), t, 1 - 0.7 * seg(u, 1.0, 1.2));
    P.cy += (1 - expoOut(seg(u, -0.1, 1.1))) * 1500;
    Devices.phone(ctx, page.mobile, P, { theme: 'graphite', scroll: maxScroll('phone', page.mobile) * 0.6 * easeInOut(seg(u, 0.9, 2.2)) });
  }
}

// Só expõe renderFrame depois das imagens carregarem: render_canvas.py espera por ela.
const load = (src, kind) => src ? new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => err(new Error('falhou ' + src)); i.src = src; })
  : Promise.resolve(Devices.placeholderPage(kind, { accent: ACCENT }));
Promise.all([load(PAGES.desktop, 'desktop'), load(PAGES.mobile, 'mobile')]).then(([desktop, mobile]) => {
  window.renderFrame = t => render(t, { desktop, mobile });
  const start = performance.now();
  (function loop(now) { window.renderFrame(((now - start) / 1000) % DURATION_S); requestAnimationFrame(loop); })(start);
});
</script>
</body>
</html>
