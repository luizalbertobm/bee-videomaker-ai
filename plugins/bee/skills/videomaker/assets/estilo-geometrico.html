<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><title>Estilo 2 — Motion graphics geométrico</title>
<style>body{margin:0;background:#111;display:grid;place-items:center;height:100vh}canvas{max-height:100vh;max-width:100vw}</style>
</head><body><canvas id="c"></canvas>
<script>
// ESTILO 2 — MOTION GRAPHICS GEOMÉTRICO (explainer). Formas planas que se desenham e montam, traço que
// "escreve" (line dash), cartões que deslizam, stagger generoso, easing suave. Fundo claro, sombras discretas.
const WIDTH = 1080, HEIGHT = 1920, FPS = 30, DURATION_S = 4.0;
const canvas = document.getElementById('c'); canvas.width = WIDTH; canvas.height = HEIGHT;
const ctx = canvas.getContext('2d');
const C = { bg: '#f7f5ef', dark: '#1a1a1a', yellow: '#ffbf00', white: '#ffffff', line: '#1a1a1a' };
const FONT = 'Inter, "DejaVu Sans", Arial, sans-serif';
const clamp01 = x => Math.min(1, Math.max(0, x));
const seg = (t, t0, d) => clamp01((t - t0) / d);
const easeOut = t => 1 - Math.pow(1 - t, 3), easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const backOut = (t, s = 1.2) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);

function hexPath(cx, cy, r) { ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; k ? ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)) : ctx.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); } ctx.closePath(); }
// Traço que se desenha: p em 0..1 sobre o perímetro
function strokeDraw(pathFn, perimeter, p, color, lw) { if (p <= 0) return; ctx.save(); pathFn(); ctx.setLineDash([perimeter * p, perimeter]); ctx.lineDashOffset = 0; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore(); }
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

const R = 150, CELLS = [[0, 0], [1, 0], [-1, 0], [0.5, -0.87], [-0.5, -0.87], [0.5, 0.87], [-0.5, 0.87]]; // favo de 7 células
const CARDS = [['Design', 1.9], ['Desenvolvimento', 2.15], ['Lançamento', 2.4]];

function renderFrame(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, WIDTH, HEIGHT);
  // Grelha de pontos de fundo, muito discreta
  ctx.fillStyle = 'rgba(26,26,26,0.08)'; for (let y = 60; y < HEIGHT; y += 60) for (let x = 60; x < WIDTH; x += 60) ctx.fillRect(x - 2, y - 2, 4, 4);

  // 1) Favo: cada célula desenha o contorno (0–1,2 s) e depois enche a amarelo com pequeno "pop"
  const hx = WIDTH / 2, hy = 640, per = 6 * R;
  CELLS.forEach(([ux, uy], k) => {
    const cx = hx + ux * R * 1.78, cy = hy + uy * R * 1.78;
    const draw = easeInOut(seg(t, 0.1 + k * 0.12, 0.6)), fill = backOut(seg(t, 0.9 + k * 0.08, 0.35));
    if (fill > 0) { ctx.save(); ctx.translate(cx, cy); ctx.scale(fill, fill); ctx.fillStyle = k === 0 ? C.dark : C.yellow; hexPath(0, 0, R * 0.92); ctx.fill(); ctx.restore(); }
    strokeDraw(() => hexPath(cx, cy, R * 0.92), per, draw, C.line, 10);
  });
  // ícone central: "código" < / > que se escreve dentro da célula escura
  const code = easeOut(seg(t, 1.4, 0.4));
  if (code > 0) { ctx.save(); ctx.globalAlpha = code; ctx.fillStyle = C.yellow; ctx.font = `800 110px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('</>', hx, hy + 6); ctx.restore(); }

  // 2) Título com sublinhado que se desenha
  const tt = easeOut(seg(t, 1.5, 0.5));
  ctx.save(); ctx.globalAlpha = tt; ctx.fillStyle = C.dark; ctx.font = `800 96px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('O que fazemos', WIDTH / 2, 1060 + (1 - tt) * 30); ctx.restore();
  const ul = easeInOut(seg(t, 1.8, 0.4)); ctx.fillStyle = C.yellow; ctx.fillRect(WIDTH / 2 - 260 * ul, 1125, 520 * ul, 14);

  // 3) Cartões que deslizam da direita com sombra suave e um ponto que "acende"
  CARDS.forEach(([label, t0], k) => {
    const e = easeOut(seg(t, t0, 0.5)); if (e <= 0) return;
    const x = 110 + (1 - e) * 500, y = 1230 + k * 190, w = 860, h = 150;
    ctx.save(); ctx.globalAlpha = e; ctx.shadowColor = 'rgba(0,0,0,0.12)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
    ctx.fillStyle = C.white; roundRect(x, y, w, h, 28); ctx.fill(); ctx.restore();
    ctx.save(); ctx.globalAlpha = e; const dot = backOut(seg(t, t0 + 0.3, 0.3));
    ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(x + 80, y + h / 2, Math.max(0, 26 * dot), 0, 6.28); ctx.fill();
    ctx.fillStyle = C.dark; ctx.font = `700 60px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, x + 150, y + h / 2 + 2); ctx.restore();
  });

  // 4) Círculo decorativo que orbita devagar (movimento contínuo mantém a cena viva)
  const a = t * 0.8; ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.arc(hx + Math.cos(a) * 420, hy + Math.sin(a) * 420, 22, 0, 6.28); ctx.fill();
}
let start = performance.now();
(function loop(now) { renderFrame(((now - start) / 1000) % DURATION_S); requestAnimationFrame(loop); })(start);
</script></body></html>
