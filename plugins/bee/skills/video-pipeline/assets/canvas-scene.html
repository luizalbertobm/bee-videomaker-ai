<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Cena</title>
<style>body{margin:0;background:#111;display:grid;place-items:center;height:100vh}canvas{background:#000;max-height:100vh;max-width:100vw}button{position:fixed;top:12px;right:12px}</style>
</head>
<body>
<canvas id="c"></canvas>
<button onclick="exportWebM()">Exportar WebM (pré-visualização)</button>
<script>
// Constantes lidas por ${CLAUDE_PLUGIN_ROOT}/skills/video-pipeline/scripts/render_canvas.py — manter estes nomes.
const WIDTH = 1080, HEIGHT = 1920, FPS = 30, DURATION_S = 5;
// Paleta de exemplo: substituir pelas cores do manual da marca (sources/identidade-visual.md) ou do briefing.
const PALETTE = { bg: '#101828', fg: '#ffffff', accent: '#ffb703', dark: '#1a1a1a', light: '#f7f7f5' };
// Fontes da marca em sources/fonts/ (display para títulos, body para corpo/UI). Ajustar nomes e ficheiros.
const FONT = '"BrandDisplay", "DejaVu Sans", Arial, sans-serif';
const FONT_BODY = '"BrandBody", "DejaVu Sans", Arial, sans-serif';
const FONT_FACES = [['BrandDisplay', '../sources/fonts/display.ttf', '100 900'], ['BrandBody', '../sources/fonts/body.ttf', '300 800']];
const loadFonts = () => {
  const st = document.createElement('style');
  st.textContent = FONT_FACES.map(([f, u, w]) => `@font-face{font-family:"${f}";src:url("${u}") format("truetype");font-weight:${w}}`).join('');
  document.head.appendChild(st);
  return Promise.all(FONT_FACES.map(([f]) => document.fonts.load(`700 100px "${f}"`)));
};

const canvas = document.getElementById('c');
canvas.width = WIDTH; canvas.height = HEIGHT;
const ctx = canvas.getContext('2d');

// Easing utilitário
const easeOut = t => 1 - Math.pow(1 - t, 3);
const clamp01 = t => Math.min(1, Math.max(0, t));

// Imagens fonte (logos) vêm de sources/ — caminho relativo a scenes/
const ASSETS = { logo: '../sources/logos/logo.svg' };
const img = {};
const loadAll = () => Promise.all(Object.entries(ASSETS).map(([k, src]) =>
  new Promise((ok, err) => { const i = new Image(); i.onload = () => { img[k] = i; ok(); }; i.onerror = err; i.src = src; })));

// Desenha uma imagem centrada em (cx, cy) com largura w, mantendo proporção
function drawImageFit(im, cx, cy, w) {
  const h = w * im.height / im.width;
  ctx.drawImage(im, cx - w / 2, cy - h / 2, w, h);
}

// Determinística: desenha o frame no instante t (segundos). Sem estado entre chamadas.
function _renderFrame(t) {
  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Exemplo: logo entra de baixo com fade
  const p = easeOut(clamp01(t / 1.0));
  ctx.globalAlpha = p;
  if (img.logo) drawImageFit(img.logo, WIDTH / 2, HEIGHT / 2 - 120 + (1 - p) * 80, WIDTH * 0.6);

  // Exemplo: título
  ctx.fillStyle = PALETTE.fg;
  ctx.font = `bold 96px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.fillText('TÍTULO DA CENA', WIDTH / 2, HEIGHT / 2 + 160 + (1 - p) * 80);
  ctx.globalAlpha = 1;

  // Exemplo: barra de progresso
  ctx.fillStyle = PALETTE.accent;
  ctx.fillRect(0, HEIGHT - 16, WIDTH * clamp01(t / DURATION_S), 16);
}

// Só expõe renderFrame depois das imagens e fontes carregarem: render_canvas.py espera por ela.
Promise.all([loadAll(), loadFonts()]).then(() => {
  window.renderFrame = _renderFrame;
  let start = performance.now();
  function loop(now) {
    renderFrame(((now - start) / 1000) % DURATION_S);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window._restart = () => { start = performance.now(); };
});

// Pré-visualização rápida no browser. A saída oficial é o MP4 de ${CLAUDE_PLUGIN_ROOT}/skills/video-pipeline/scripts/render_canvas.py.
async function exportWebM() {
  const stream = canvas.captureStream(FPS);
  const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8_000_000 });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'cena.webm'; a.click();
  };
  window._restart && window._restart();
  rec.start();
  setTimeout(() => rec.stop(), DURATION_S * 1000);
}
</script>
</body>
</html>
